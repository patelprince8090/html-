<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form & Input Fields</title>
</head>

<body>
    <h1>Form & Input Fields</h1>
    <label for="Name">Name </label>
    <input type="text" placeholder="Enter your Name" required>

    <br>
    <br>

    <label for="Email">Email</label>
    <input type="email" placeholder="Enter your Email" required>

    <br>
    <br>

    <label for="Password">Password</label>
    <input type="password" placeholder="Enter your Password" required>

    <br>
    <br>
    <label for="Gender">Gender </label>

    <input type="radio" value="Male" name="Gender" required>
    <label for="Male">Male</label>

    <input type="radio" value="Female" name="Gender" required>
    <label for="Female">Female</label>

    <br>
    <br>
    <label for="Hobby">Hobby</label>
    <br>
    <br>
    <input type="checkbox" value="cricket">
    <label for="cricket">Cricket</label>
    <br>

    <input type="checkbox" value="football">
    <label for="football">Football</label>

    <br>

    <input type="checkbox" value="Swimming">
    <label for="Swimming">Swimming</label>

    <br>
    <br>

    <label for="City">Choose your city</label>
    <select>
        <option value="delhi">Delhi</option>
        <option value="Modasa">Modasa</option>
        <option value="vadodara">vadodara</option>
        <option value="Anand">Anand</option>
        <option value="Mumbai">Mumbai</option>
    </select>

    <br>
    <br>

    <label for="DOB">Date of Birth</label>
    <input type="date">

    <br>
    <br>

    <label for="">Tell me someting about yourself</label>
    <br>
    <textarea name="" id=""></textarea>

    <br>
    <br>
    <!-- <button>Submit</button> -->

    <input type="Submit" value="Submit the form">

</body>
</html>
